<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Dashboard Docente</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
<div class="container mt-4">
<div class="mb-4">
    <a href="inicio.html" class="btn btn-danger">
        Cerrar sesión
    </a>
</div>
    <h1 class="mb-4">Panel Docente</h1>
    <!-- TARJETAS -->
    <div class="row">
        <div class="col-md-4 mb-4">
            <div class="card p-3">
                <h3>3</h3>
                <p>Votaciones creadas</p>
            </div>
        </div>
        <div class="col-md-4 mb-4">
            <div class="card p-3">
                <h3>250</h3>
                <p>Estudiantes registrados</p>
            </div>
        </div>
        <div class="col-md-4 mb-4">
            <div class="card p-3">
                <h3>90%</h3>
                <p>Participación estudiantil</p>
            </div>
        </div>
    </div>
    <!-- TABLA -->
    <div class="card p-4 mt-4">
        <h3 class="mb-3">Votaciones creadas</h3>
        <table class="table">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Votación</th>
                    <th>Curso</th>
                    <th>Estado</th>
                </tr>
            </thead>
            <tbody>
                <tr>
                    <td>01</td>
                    <td>Personero 2026</td>
                    <td>11A</td>
                    <td>Activa</td>
                </tr>
                <tr>
                    <td>02</td>
                    <td>Contralor 2026</td>
                    <td>10B</td>
                    <td>Finalizada</td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
