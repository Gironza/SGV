<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Registro | SGV</title>

    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
<section class="register-container">
    <div class="register-card">
        <div class="register-left">
            <h1>Únete a SGV</h1>
            <p>
                Crea tu cuenta y participa en los procesos
                electorales estudiantiles de manera segura.
            </p>

            <img src="https://cdn-icons-png.flaticon.com/512/4207/4207247.png" alt="Registro">

        </div>
        <div class="register-right">
            <h2>Crear Cuenta</h2>
            <form>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Nombres</label>
                        <input type="text"
                               class="form-control"
                               placeholder="Ingrese nombres">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Apellidos</label>
                        <input type="text"
                               class="form-control"
                               placeholder="Ingrese apellidos">
                    </div>
                </div>
                <div class="mb-3">
                    <label class="form-label">Correo electrónico</label>
                    <input type="email"
                           class="form-control"
                           placeholder="Ingrese correo">
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Contraseña</label>
                        <input type="password"
                               class="form-control"
                               placeholder="Ingrese contraseña">
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Confirmar contraseña</label>
                        <input type="password"
                               class="form-control"
                               placeholder="Confirmar contraseña">
                    </div>
                </div>
                <div class="row">
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Rol</label>
                        <select class="form-select">

                            <option>Seleccione rol</option>
                            <option>Administrador</option>
                            <option>Docente</option>
                            <option>Estudiante</option>
                            <option>Candidato</option>

                        </select>
                    </div>
                    <div class="col-md-6 mb-3">
                        <label class="form-label">Curso</label>
                        <input type="text"
                               class="form-control"
                               placeholder="Ej: 10A">
                    </div>
                </div>
                <a href="/login"class="register-btn-full text-decoration-none d-block text-center">Registrarse</a>
                    Registrarse
                </button>
            </form>
            <p class="login-text">
                ¿Ya tienes cuenta?
                <a href="/login">
                    Inicia sesión
                </a>
            </p>
        </div>
    </div>
</section>
</body>
</html>
