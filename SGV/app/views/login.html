<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <link rel="stylesheet" href="/archivos/css/estilos.css">

</head>
<body>
    <div class="contenedor-login">
        <h1>Sistema de Votaciones</h1>
        <form action="/login" method="post">
            <input
                type="text"
                name="usuario"
                placeholder="Usuario"
            >

            <input
                type="password"
                name="password"
                placeholder="Contraseña"
            >

            <button type="submit">
                Ingresar
            </button>
        </form>
    </div>
</body>
</html>
